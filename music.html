<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vova Sosnilo's Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
  <script defer src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
  <script>
    try {
      if (localStorage.getItem("theme") === "light") document.documentElement.classList.add("light");
    } catch (e) {}
  </script>
</head>
<body>
  <header id="site-header">
    <h1 id="site-title">Vova Sosnilo</h1>
    <h2><a href="index.html"><span class="label-wide">about</span><span class="label-narrow">about</span></a></h2>
    <h2><a href="math.html"><span class="label-wide">math</span><span class="label-narrow">math</span></a></h2>
    <h2><a href="music.html" aria-current="page"><span class="label-wide"><span class="arrow">-&gt;&nbsp;</span>music</span><span class="label-narrow"><span class="arrow">&gt;</span>music</span></a></h2>
    <h2><a href="other.html"><span class="label-wide">other</span><span class="label-narrow">other</span></a></h2>
  </header>
  <button id="theme-toggle" type="button" aria-label="Switch to light mode">☼</button>
  <main>
    <!--p>
      You can learn about the music I make here 
    </p!-->

    <h2><a href="https://po-me-hi.bandcamp.com/">pomehi</a></h2>
    
    <div class="media">
      <div id="video" data-plyr-provider="youtube" data-plyr-embed-id="9S1iymop5co"></div>
    </div>
    <br>
    <h2><a href="https://abrasive-materials.bandcamp.com/">абразивные материалы</a></h2>

    <div class="media covers">
      <a href="https://abrasive-materials.bandcamp.com/album/-"><img src="images/obzhoka.jpg" alt="ОБЖОКА — album cover"></a>
      <a href="https://abrasive-materials.bandcamp.com/album/--2"><img src="images/nuda.png" alt="Album cover"></a>
    </div>

  </main>
  <script>
    const toggle = document.getElementById("theme-toggle");
    function showIcon(light) {
      toggle.textContent = light ? "☾" : "☼";
      toggle.setAttribute("aria-label", light ? "Switch to dark mode" : "Switch to light mode");
    }
    showIcon(document.documentElement.classList.contains("light"));
    toggle.addEventListener("click", () => {
      const light = document.documentElement.classList.toggle("light");
      showIcon(light);
      try {
        localStorage.setItem("theme", light ? "light" : "dark");
      } catch (e) {}
    });
  </script>
  <script>
    // Plyr controls over the YouTube embed; bare YouTube iframe if the Plyr CDN is unreachable
    document.addEventListener("DOMContentLoaded", () => {
      const video = document.getElementById("video");
      if (window.Plyr) {
        new Plyr(video);
      } else {
        const id = video.dataset.plyrEmbedId;
        video.outerHTML = `<iframe class="video-fallback" src="https://www.youtube.com/embed/${id}" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
      }
    });
  </script>
</body>
</html>
